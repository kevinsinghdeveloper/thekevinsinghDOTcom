<main class="page topics-page">
  <section class="portfolio-block py-5">
    <div class="container">
      <div class="text-center mb-5">
        <h2 class="display-4 fw-bold mb-3">Knowledge Base</h2>
        <p class="lead text-muted">Insights and best practices in data engineering and software development</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-4 col-md-6" *ngFor="let topic of topics">
          <div class="card h-100 border-0 shadow-sm hover-lift" (click)="viewTopic(topic.id)" style="cursor: pointer;">
            <div class="card-body">
              <div class="mb-3">
                <span class="badge bg-primary">{{topic.category}}</span>
              </div>
              <h5 class="card-title fw-bold mb-3">{{topic.title}}</h5>
              <p class="card-text text-muted">{{topic.excerpt}}</p>
              <div class="mt-3">
                <a class="text-primary fw-medium text-decoration-none">
                  Read more <i class="fas fa-arrow-right ms-1"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
